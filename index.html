<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071019">
  <title>Bryce Strategy</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">BS</div>
        <div>
          <div class="brand-name">Bryce Strategy</div>
          <div class="brand-sub">BingX Market Dashboard</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="主選單">
        <button class="nav-item active" data-route="dashboard">
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </button>

        <button class="nav-item" data-route="sectors">
          <span class="nav-icon">◫</span>
          <span>板塊</span>
        </button>

        <button class="nav-item" data-route="sector-ai">
          <span class="nav-icon">AI</span>
          <span>AI</span>
        </button>

        <button class="nav-item" data-route="sector-meme">
          <span class="nav-icon">M</span>
          <span>Meme</span>
        </button>

        <button class="nav-item" data-route="sector-rwa">
          <span class="nav-icon">R</span>
          <span>RWA</span>
        </button>

        <button class="nav-item" data-route="watchlist">
          <span class="nav-icon">★</span>
          <span>自選幣</span>
        </button>

        <button class="nav-item" data-route="calculator">
          <span class="nav-icon">%</span>
          <span>倉位計算</span>
        </button>

        <button class="nav-item" data-route="records">
          <span class="nav-icon">≡</span>
          <span>下單紀錄</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="ws-status">
          <span class="status-dot" id="wsDot"></span>
          <span id="wsText">BingX 連線中</span>
        </div>

        <button id="reconnectBtn" class="secondary-btn sidebar-reconnect" type="button">
          重新連線
        </button>
      </div>
    </aside>

    <section class="content-shell">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div id="pageSubtitle" class="topbar-subtitle">市場總覽與板塊強弱</div>
        </div>

        <div class="topbar-meta">
          <span>最後更新</span>
          <strong id="lastUpdate">—</strong>
        </div>
      </header>

      <main id="mainPanel" class="main-panel"></main>
    </section>
  </div>

  <script src="js/config/sectors.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/bingx.js"></script>
  <script src="js/modules/market-store.js"></script>
  <script src="js/modules/sector-engine.js"></script>
  <script src="js/modules/risk-calculator.js"></script>
  <script src="js/modules/trade-records.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/sectors.js"></script>
  <script src="js/views/sector-detail.js"></script>
  <script src="js/views/watchlist.js"></script>
  <script src="js/views/calculator.js"></script>
  <script src="js/views/records.js"></script>
  <script src="js/router/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
