<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>交易 Dashboard</title>

  <style>
    :root {
      --bg: #090d12;
      --panel: #111821;
      --panel-hover: #151e29;
      --border: #26303d;

      --text: #f1f5f9;
      --muted: #7f8b9d;

      --green: #2fd27c;
      --red: #ff6674;
      --yellow: #e9bd4c;
      --blue: #78aefc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1280px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;
      margin-bottom: 14px;
    }

    .header-title {
      min-width: 0;
    }

    .header h1 {
      margin: 0;

      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 4px 0 0;

      color: var(--muted);
      font-size: 12px;
    }

    .refresh-btn {
      min-height: 38px;
      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
      color: var(--text);

      cursor: pointer;
    }

    .refresh-btn:hover {
      background: var(--panel-hover);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      display: grid;

      grid-template-columns:
        1.35fr
        repeat(4, minmax(0, 1fr));

      gap: 8px;
      margin-bottom: 10px;
    }

    .card {
      min-width: 0;

      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--panel);
    }

    .card.primary {
      padding: 14px 16px;
    }

    .card-label {
      margin-bottom: 4px;

      color: var(--muted);
      font-size: 11px;
    }

    .card-value {
      font-size: 27px;
      font-weight: 900;

      letter-spacing: -0.04em;

      white-space: nowrap;
    }

    .card.primary .card-value {
      font-size: 31px;
    }

    .card-sub {
      margin-top: 3px;

      color: var(--muted);
      font-size: 10px;
    }

    .positive {
      color: var(--green) !important;
    }

    .negative {
      color: var(--red) !important;
    }

    .neutral {
      color: var(--text) !important;
    }

    .yellow {
      color: var(--yellow) !important;
    }

    .blue {
      color: var(--blue) !important;
    }

    /* =========================
       TRADE PANEL
    ========================= */

    .table-panel {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--panel);
    }

    .table-header {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 38px;
      padding: 8px 10px;

      border-bottom: 1px solid var(--border);
    }

    .table-header h2 {
      width: 100%;
      margin: 0;

      text-align: center;

      font-size: 14px;
      font-weight: 800;
    }

    .trade-count {
      position: absolute;

      right: 10px;

      color: var(--muted);

      font-size: 10px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      width: 100%;
      overflow-x: hidden;
    }

    table {
      width: 100%;

      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 6px 4px;

      border-bottom:
        1px solid rgba(38, 48, 61, 0.72);

      text-align: center;

      font-size: 11px;
      line-height: 1.2;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      background: #0e141c;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.018);
    }

    /* 日期 */

    th:nth-child(1),
    td:nth-child(1) {
      width: 12%;
    }

    /* 標的 */

    th:nth-child(2),
    td:nth-child(2) {
      width: 24%;
    }

    /* 方向 */

    th:nth-child(3),
    td:nth-child(3) {
      width: 10%;
    }

    /* 槓桿 */

    th:nth-child(4),
    td:nth-child(4) {
      width: 13%;
    }

    /* 結果 */

    th:nth-child(5),
    td:nth-child(5) {
      width: 15%;
    }

    /* 淨盈虧 */

    th:nth-child(6),
    td:nth-child(6) {
      width: 26%;
    }

    .symbol {
      color: #fff;

      font-weight: 800;
      text-align: center;
    }

    /* =========================
       SIDE BADGE
    ========================= */

    .side {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 30px;
      min-height: 19px;

      padding: 0 5px;

      border-radius: 999px;

      font-size: 9px;
      font-weight: 800;
    }

    .side.long {
      color: var(--green);
      background: rgba(47, 210, 124, 0.08);
    }

    .side.short {
      color: var(--red);
      background: rgba(255, 102, 116, 0.08);
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      font-weight: 800;
    }

    .result.open {
      color: var(--blue);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      display: none;

      padding: 30px 20px;

      color: var(--muted);

      font-size: 12px;
      text-align: center;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-top: 9px;
      padding: 9px 11px;

      border-radius: 9px;

      font-size: 11px;
      line-height: 1.4;
    }

    .message.error {
      display: block;

      border:
        1px solid rgba(255, 102, 116, 0.28);

      background:
        rgba(255, 102, 116, 0.07);

      color: #ff9da6;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .summary {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .card.primary {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: calc(100% - 14px);
        padding-top: 14px;
      }

      .header {
        gap: 8px;
      }

      .header h1 {
        font-size: 21px;
      }

      .header p {
        font-size: 10px;
      }

      .refresh-btn {
        min-height: 34px;
        padding: 0 11px;

        font-size: 11px;
      }

      .summary {
        gap: 6px;
      }

      .card {
        padding: 11px 12px;
      }

      .card-value {
        font-size: 23px;
      }

      .card.primary .card-value {
        font-size: 28px;
      }

      .table-header {
        min-height: 36px;

        padding: 7px 8px;
      }

      .table-header h2 {
        font-size: 13px;
      }

      .trade-count {
        right: 8px;

        font-size: 9px;
      }

      th,
      td {
        padding: 5px 2px;

        font-size: 10px;
      }

      th {
        font-size: 9px;
      }

      .symbol {
        font-size: 10px;
      }

      .side {
        min-width: 26px;
        min-height: 17px;

        padding: 0 3px;

        font-size: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =========================
         HEADER
    ========================== -->

        </p>

      </div>

      >

      </button>

    </header>


    <!-- =========================
         SUMMARY
    ========================== -->

    <section class="summary">

      <!-- 今日勝率 -->

    <!-- =========================

    ========================== -->

    <section class="table-panel">

      <div class="table-header">

      <div class="table-wrap">

              <th>

    <div

  </main>


  <script>
    (() => {

      /* ==================================================
         8/27 今日初始本金
      ================================================== */

      const INITIAL_BALANCE = 67.09;


      /* ==================================================
         Google Sheet
      ================================================== */

      const SHEET_ID =
        "1tPLSXTk56Z-ylsDjz5VQ4R_30J4OFpGAVUmtxujqupE";

      const GID =
        "0";


      const SHEET_URLS = [

        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`,

        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`

      ];


      let trades = [];


      const $ =
        id =>
          document.getElementById(id);


      /* ==================================================
         Google Sheet 欄位

         A 日期
         B 標的
         C 方向
         D 槓桿
         E 淨盈虧

         E 空白 = 持倉中
         E > 0 = WIN
         E < 0 = LOSS
         E = 0 = BE
      ================================================== */

      const COLUMN_ALIASES = {

        date: [
          "日期",
          "日期時間",
          "交易日期",
          "date"
        ],

        symbol: [
          "標的",
          "幣種",
          "交易標的",
          "symbol",
          "pair"
        ],

        side: [
          "方向",
          "多空",
          "side"
        ],

        leverage: [
          "槓桿",
          "槓桿倍數",
          "leverage"
        ],

        netPnl: [
          "淨盈虧",
          "淨損益",
          "淨利",
          "netpnl",
          "net pnl"
        ]

      };


      /* ==================================================
         Helper
      ================================================== */

      function normalizeKey(value) {

        return String(value ?? "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "")
          .replace(
            /[＿_－\-／/\\:：()（）\[\]]/g,
            ""
          );

      }


      function number(value) {

        const cleaned =
          String(value ?? "")
            .replace(/,/g, "")
            .replace(
              /USDT|USDC|USD|U|\$/gi,
              ""
            )
            .trim();


        const result =
          Number(cleaned);


        return Number.isFinite(result)
          ? result
          : 0;

      }


      function escapeHtml(value) {

        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      }


      function findColumn(
        headers,
        aliases
      ) {

        const normalizedHeaders =
          headers.map(
            header =>
              normalizeKey(header)
          );


        for (
          const alias
          of aliases
        ) {

          const normalizedAlias =
            normalizeKey(alias);


          const index =
            normalizedHeaders.indexOf(
              normalizedAlias
            );


          if (
            index !== -1
          ) {

            return headers[index];

          }

        }


        return null;

      }


      function formatPnl(value) {

        const n =
          number(value);


        return (
          `${n >= 0 ? "+" : ""}` +
          `${n.toFixed(2)} U`
        );

      }


      /* ==================================================
         日期處理
      ================================================== */

      function normalizeDate(value) {

        const text =
          String(value ?? "")
            .trim();


        if (
          !text
        ) {

          return "";

        }


        const match =
          text.match(
            /(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
          );


        if (
          match
        ) {

          const year =
            match[1];

          const month =
            String(
              match[2]
            ).padStart(
              2,
              "0"
            );

          const day =
            String(
              match[3]
            ).padStart(
              2,
              "0"
            );


          return (
            `${year}-${month}-${day}`
          );

        }


        return text;

      }


      function displayDate(value) {

        const normalized =
          normalizeDate(value);


        const match =
          normalized.match(
            /(\d{4})-(\d{2})-(\d{2})/
          );


        if (
          !match
        ) {

          return value || "-";

        }


        return (
          `${match[2]}/${match[3]}`
        );

      }


      function todayString() {

        const now =
          new Date();


        const year =
          now.getFullYear();


        const month =
          String(
            now.getMonth() + 1
          ).padStart(
            2,
            "0"
          );


        const day =
          String(
            now.getDate()
          ).padStart(
            2,
            "0"
          );


        return (
          `${year}-${month}-${day}`
        );

      }


      /* ==================================================
         CSV Parser
      ================================================== */

      function parseCSV(text) {

        const rows = [];

        let row = [];
        let cell = "";

        let inQuotes =
          false;


        for (
          let i = 0;
          i < text.length;
          i++
        ) {

          const char =
            text[i];

          const next =
            text[i + 1];


          if (
            inQuotes
          ) {

            if (
              char === '"' &&
              next === '"'
            ) {

              cell += '"';

              i++;

            }

            else if (
              char === '"'
            ) {

              inQuotes =
                false;

            }

            else {

              cell +=
                char;

            }

          }

          else {

            if (
              char === '"'
            ) {

              inQuotes =
                true;

            }

            else if (
              char === ","
            ) {

              row.push(
                cell
              );

              cell =
                "";

            }

            else if (
              char === "\n"
            ) {

              row.push(
                cell.replace(
                  /\r$/,
                  ""
                )
              );


              rows.push(
                row
              );


              row =
                [];


              cell =
                "";

            }

            else {

              cell +=
                char;

            }

          }

        }


        if (
          cell.length ||
          row.length
        ) {

          row.push(
            cell.replace(
              /\r$/,
              ""
            )
          );


          rows.push(
            row
          );

        }


        return rows.filter(

          row =>

            row.some(

              value =>

                String(value)
                  .trim() !== ""

            )

        );

      }


      /* ==================================================
         Google Sheet 轉換
      ================================================== */

      function mapSheet(
        matrix
      ) {

        if (
          !matrix.length
        ) {

          return [];

        }


        const headers =
          matrix[0].map(

            value =>
              String(value)
                .trim()

          );


        const columns =
          {};


        Object
          .entries(
            COLUMN_ALIASES
          )
          .forEach(

            ([key, aliases]) => {

              columns[key] =
                findColumn(
                  headers,
                  aliases
                );

            }

          );


        if (
          !columns.symbol
        ) {

          throw new Error(
            "找不到「標的」欄位"
          );

        }


        if (
          !columns.netPnl
        ) {

          throw new Error(
            "找不到「淨盈虧」欄位"
          );

        }


        return matrix
          .slice(1)

          .map(

            (values, index) => {

              const row =
                {};


              headers.forEach(

                (
                  header,
                  columnIndex
                ) => {

                  row[header] =
                    values[
                      columnIndex
                    ] ?? "";

                }

              );


              /* =========================
                 淨盈虧

                 空白 = 持倉中
              ========================= */

              const rawPnl =
                row[
                  columns.netPnl
                ] ?? "";


              const hasPnl =
                String(
                  rawPnl
                ).trim() !== "";


              const netPnl =
                hasPnl
                  ? number(rawPnl)
                  : 0;


              /* =========================
                 方向
              ========================= */

              let side =
                columns.side
                  ? String(
                      row[
                        columns.side
                      ] ?? ""
                    ).trim()
                  : "";


              if (
                /long|buy|多單|做多/i
                  .test(side)
              ) {

                side =
                  "多";

              }


              if (
                /short|sell|空單|做空/i
                  .test(side)
              ) {

                side =
                  "空";

              }


              /* =========================
                 狀態
              ========================= */

              let status =
                "OPEN";


              if (
                hasPnl
              ) {

                if (
                  netPnl > 0
                ) {

                  status =
                    "WIN";

                }

                else if (
                  netPnl < 0
                ) {

                  status =
                    "LOSS";

                }

                else {

                  status =
                    "BE";

                }

              }


              return {

                id:
                  index,

                date:
                  columns.date
                    ? row[
                        columns.date
                      ]
                    : "",

                symbol:
                  String(
                    row[
                      columns.symbol
                    ] ?? ""
                  ).trim(),

                side,

                leverage:
                  columns.leverage
                    ? String(
                        row[
                          columns.leverage
                        ] ?? ""
                      ).trim()
                    : "",

                status,

                hasPnl,

                netPnl

              };

            }

          )

          .filter(

            trade =>

              trade.symbol !== ""

          );

      }


      /* ==================================================
         Google Sheet Fetch
      ================================================== */

      async function fetchSheet() {

        const button =
          $("refreshBtn");


        const message =
          $("message");


        button.disabled =
          true;


        button.textContent =
          "更新中";


        message.className =
          "message";


        message.style.display =
          "none";


        let lastError =
          null;


        for (
          const baseUrl
          of SHEET_URLS
        ) {

          try {

            const url =
              `${baseUrl}` +
              `${baseUrl.includes("?") ? "&" : "?"}` +
              `_=${Date.now()}`;


            const response =
              await fetch(

                url,

                {
                  cache:
                    "no-store",

                  credentials:
                    "omit"
                }

              );


            if (
              !response.ok
            ) {

              throw new Error(
                `HTTP ${response.status}`
              );

            }


            const text =
              await response.text();


            if (
              /<!doctype html|<html/i
                .test(
                  text.slice(
                    0,
                    500
                  )
                )
            ) {

              throw new Error(
                "Google Sheet 尚未開放讀取"
              );

            }


            const matrix =
              parseCSV(

                text.replace(
                  /^\uFEFF/,
                  ""
                )

              );


            trades =
              mapSheet(
                matrix
              );


            render();


            button.disabled =
              false;


            button.textContent =
              "更新";


            return;

          }

          catch (
            error
          ) {

            lastError =
              error;

          }

        }


        button.disabled =
          false;


        button.textContent =
          "更新";


        message.textContent =
          "讀取失敗：" +
          (
            lastError?.message ||
            "未知錯誤"
          );


        message.className =
          "message error";

      }


      /* ==================================================
         Summary
      ================================================== */

      function renderSummary() {

        const today =
          todayString();


        const todayTrades =
          trades.filter(

            trade =>

              normalizeDate(
                trade.date
              ) === today

          );


        const todayOpenTrades =
          todayTrades.filter(

            trade =>
              trade.status === "OPEN"

          );


        const todayClosedTrades =
          todayTrades.filter(

            trade =>
              trade.status !== "OPEN"

          );


        const todayWins =
          todayClosedTrades.filter(

            trade =>
              trade.netPnl > 0

          ).length;


        const todayLosses =
          todayClosedTrades.filter(

            trade =>
              trade.netPnl < 0

          ).length;


        const closedToday =
          todayWins +
          todayLosses;


        const winRate =
          closedToday > 0

            ? (
                todayWins /
                closedToday
              ) * 100

            : 0;


        const todayPnl =
          todayClosedTrades.reduce(

            (
              total,
              trade
            ) =>

              total +
              trade.netPnl,

            0

          );


        const currentBalance =
          INITIAL_BALANCE +
          todayPnl;


        /* =========================
           資金水位
        ========================= */

        const balanceElement =
          $("balance");


        balanceElement.textContent =
          `${currentBalance.toFixed(2)} U`;


        balanceElement.className =
          "card-value";


        if (
          currentBalance >
          INITIAL_BALANCE
        ) {

          balanceElement
            .classList
            .add(
              "positive"
            );

        }

        else if (
          currentBalance <
          INITIAL_BALANCE
        ) {

          balanceElement
            .classList
            .add(
              "negative"
            );

        }


        /* =========================
           資金變化
        ========================= */

        $("balanceChange")
          .textContent =

            `今日初始 ${INITIAL_BALANCE.toFixed(2)} U ｜ ` +

            `${todayPnl >= 0 ? "+" : ""}` +

            `${todayPnl.toFixed(2)} U`;


        /* =========================
           今日交易
        ========================= */

        $("todayTrades")
          .textContent =
            todayTrades.length;


        $("openTradeText")
          .textContent =
            `持倉 ${todayOpenTrades.length} 筆`;


        /* =========================
           今日勝 / 負
        ========================= */

        $("todayWL")
          .innerHTML =

            `<span class="positive">${todayWins}</span>` +

            ` / ` +

            `<span class="negative">${todayLosses}</span>`;


        /* =========================
           今日勝率

           < 50 = 紅
           > 50 = 綠
           = 50 = 黃
        ========================= */

        const winRateElement =
          $("winRate");


        winRateElement.textContent =
          `${winRate.toFixed(1)}%`;


        winRateElement.className =
          "card-value";


        if (
          closedToday === 0
        ) {

          winRateElement
            .classList
            .add(
              "neutral"
            );

        }

        else if (
          winRate < 50
        ) {

          winRateElement
            .classList
            .add(
              "negative"
            );

        }

        else if (
          winRate > 50
        ) {

          winRateElement
            .classList
            .add(
              "positive"
            );

        }

        else {

          winRateElement
            .classList
            .add(
              "yellow"
            );

        }


        /* =========================
           今日淨盈虧
        ========================= */

        const pnlElement =
          $("todayPnl");


        pnlElement.textContent =
          formatPnl(
            todayPnl
          );


        pnlElement.className =
          "card-value";


        if (
          todayPnl > 0
        ) {

          pnlElement
            .classList
            .add(
              "positive"
            );

        }

        else if (
          todayPnl < 0
        ) {

          pnlElement
            .classList
            .add(
              "negative"
            );

        }


        $("todayTradesText")
          .textContent =
            `已平倉 ${todayClosedTrades.length} 筆`;

      }


      /* ==================================================
         Table
      ================================================== */

      function renderTable() {

        const tbody =
          $("tradeRows");


        const empty =
          $("emptyState");


        tbody.innerHTML =
          "";


        const sortedTrades =
          [...trades]
            .reverse();


        $("tradeCount")
          .textContent =
            `${trades.length} 筆`;


        empty.style.display =
          sortedTrades.length
            ? "none"
            : "block";


        for (
          const trade
          of sortedTrades
        ) {

          const row =
            document.createElement(
              "tr"
            );


          /* 槓桿 */

          let leverage =
            trade.leverage ||
            "-";


          if (
            leverage !== "-" &&
            !String(leverage)
              .toLowerCase()
              .includes("x")
          ) {

            leverage +=
              "x";

          }


          /* PNL 顏色 */

          const pnlClass =
            trade.status === "OPEN"

              ? "blue"

              : trade.netPnl > 0

                ? "positive"

                : trade.netPnl < 0

                  ? "negative"

                  : "yellow";


          /* Result 顏色 */

          const resultClass =
            trade.status === "WIN"

              ? "positive"

              : trade.status === "LOSS"

                ? "negative"

                : trade.status === "OPEN"

                  ? "open"

                  : "yellow";


          /* PNL 顯示 */

          const pnlText =
            trade.status === "OPEN"

              ? "-"

              : formatPnl(
                  trade.netPnl
                );


          row.innerHTML = `

            <td>
              ${escapeHtml(
                displayDate(
                  trade.date
                )
              )}
            </td>

            <td class="symbol">
              ${escapeHtml(
                trade.symbol
              )}
            </td>

            <td>

              ${
                trade.side

                  ? `
                    <span
                      class="side ${
                        trade.side === "多"
                          ? "long"
                          : "short"
                      }"
                    >
                      ${escapeHtml(
                        trade.side
                      )}
                    </span>
                  `

                  : "-"
              }

            </td>

            <td>
              ${escapeHtml(
                leverage
              )}
            </td>

            <td
              class="result ${resultClass}"
            >
              ${escapeHtml(
                trade.status
              )}
            </td>

            <td
              class="${pnlClass}"
            >
              ${escapeHtml(
                pnlText
              )}
            </td>

          `;


          tbody.appendChild(
            row
          );

        }

      }


      /* ==================================================
         Render
      ================================================== */

      function render() {

        renderSummary();

        renderTable();

      }


      /* ==================================================
         Events
      ================================================== */

      $("refreshBtn")
        .addEventListener(
          "click",
          fetchSheet
        );


      /* ==================================================
         Init
      ================================================== */

      render();

      fetchSheet();

    })();
  </script>

</body>
