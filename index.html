<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bryce Strategy · 1% 風控下單</title>

<style>
:root {
    color-scheme: dark;
    --bg: #070b11;
    --panel: #101824;
    --panel-2: #0b121d;
    --border: #29394f;
    --text: #eef4fc;
    --muted: #9aaac0;
    --green: #21d6a2;
    --red: #ff708c;
    --yellow: #f0c65d;
    --blue: #4f8cc9;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0b111b, #05080d);
    color: var(--text);
    font-family: Arial, "Noto Sans TC", sans-serif;
}

button, input, select { font: inherit; }

button, input, select {
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    background: var(--panel-2);
}

button {
    min-height: 42px;
    padding: 9px 14px;
    font-weight: 700;
    cursor: pointer;
}

button:hover { border-color: #6b87ad; }
button:disabled { opacity: .45; cursor: not-allowed; }

input, select {
    width: 100%;
    min-width: 0;
    padding: 11px;
}

label {
    display: grid;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
}

h1, h2, p { margin: 0; }

.app {
    width: min(100% - 28px, 820px);
    margin: auto;
    padding: 24px 0 72px;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.logo {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: #223b5b;
    font-weight: 900;
}

.brand strong { font-size: 20px; }
.subtitle {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
}

.panel {
    margin-top: 18px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
}

.rule-strip {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 16px;
}

.rule-card {
    padding: 14px;
    border: 1px solid #3c5069;
    border-radius: 10px;
    background: #0b1420;
}

.rule-label {
    color: var(--muted);
    font-size: 11px;
}

.rule-value {
    margin-top: 5px;
    font-family: Consolas, monospace;
    font-size: 22px;
    font-weight: 900;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-top: 18px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
    margin-top: 18px;
}

.cell {
    min-width: 0;
    padding: 13px;
    border-radius: 10px;
    background: #080f1980;
}

.cell.focus {
    border: 1px solid #6c6234;
    background: #211e12;
}

.cell-label {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
}

.cell-value {
    margin-top: 7px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 17px;
    font-weight: 900;
}

.cell.focus .cell-value {
    color: var(--yellow);
    font-size: 20px;
}

.positive { color: var(--green); }
.negative { color: var(--red); }
.yellow { color: var(--yellow); }

.error {
    margin-top: 14px;
    color: #ff9caf;
    font-size: 13px;
    line-height: 1.6;
}

.note {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

.primary {
    background: #20486c;
    border-color: #37678d;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 28px;
}

.record-count {
    color: var(--muted);
    font-size: 12px;
}

.record-list {
    display: grid;
    gap: 10px;
    margin-top: 14px;
}

.record-card {
    padding: 15px;
    border: 1px solid #30445e;
    border-radius: 12px;
    background: #0d1723;
}

.record-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.symbol {
    font-size: 19px;
    font-weight: 900;
    overflow-wrap: anywhere;
}

.meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
}

.record-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 13px;
}

.mini {
    min-width: 0;
    padding: 10px;
    border-radius: 8px;
    background: #080f1980;
}

.mini span {
    display: block;
    color: var(--muted);
    font-size: 10px;
}

.mini strong {
    display: block;
    margin-top: 5px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 13px;
}

.delete-btn {
    min-height: 34px;
    padding: 5px 9px;
    color: #ff9caf;
    font-size: 11px;
}

.empty {
    margin-top: 14px;
    padding: 34px 14px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 620px) {
    .app { width: calc(100% - 20px); padding-top: 16px; }
    .form-grid, .rule-strip { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .record-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 380px) {
    .result-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<main class="app">
    <header class="header">
        <div class="logo">BS</div>
        <div class="brand">
            <strong>Bryce Strategy</strong>
            <div class="subtitle">50X · 單筆風險固定 1%</div>
        </div>
    </header>

    <section class="panel">
        <h2>下單計算</h2>

        <div class="rule-strip">
            <div class="rule-card">
                <div class="rule-label">固定槓桿</div>
                <div class="rule-value">50X</div>
            </div>
            <div class="rule-card">
                <div class="rule-label">單筆最大風險</div>
                <div class="rule-value yellow">1%</div>
            </div>
        </div>

        <form id="tradeForm" class="form-grid" novalidate>
            <label>總資金 · U
                <input name="balance" type="number" step="any" min="0.00000001" value="50" required>
            </label>

            <label>幣種
                <input name="symbol" type="text" maxlength="30" placeholder="例如 BTC、ETH、UNI" autocomplete="off" required>
            </label>

            <label>方向
                <select name="side">
                    <option value="long">LONG · 做多</option>
                    <option value="short">SHORT · 做空</option>
                </select>
            </label>

            <label>進場價
                <input name="entry" type="number" step="any" min="0.00000001" placeholder="例如 7.004" required>
            </label>

            <label>止損價
                <input name="sl" type="number" step="any" min="0.00000001" placeholder="例如 6.974" required>
            </label>
        </form>

        <div id="error" class="error" role="status"></div>

        <div id="results" class="result-grid">
            <div class="cell focus">
                <div class="cell-label">建議保證金</div>
                <div id="marginResult" class="cell-value">—</div>
            </div>
            <div class="cell">
                <div class="cell-label">使用總資金</div>
                <div id="marginPctResult" class="cell-value">—</div>
            </div>
            <div class="cell">
                <div class="cell-label">最大可虧損</div>
                <div id="riskResult" class="cell-value">—</div>
            </div>
            <div class="cell">
                <div class="cell-label">名義倉位</div>
                <div id="notionalResult" class="cell-value">—</div>
            </div>
            <div class="cell">
                <div class="cell-label">持倉數量 · 幣</div>
                <div id="quantityResult" class="cell-value">—</div>
            </div>
            <div class="cell">
                <div class="cell-label">Entry → SL 距離</div>
                <div id="stopPctResult" class="cell-value">—</div>
            </div>
        </div>

        <div class="actions">
            <button id="saveBtn" type="button" class="primary" disabled>儲存下單紀錄</button>
        </div>

        <p class="note">
            計算方式：最大可虧損＝總資金 × 1%；持倉數量＝最大可虧損 ÷ |進場價 − 止損價|；
            名義倉位＝持倉數量 × 進場價；保證金＝名義倉位 ÷ 50。
            未計入手續費、滑價與資金費。
        </p>
    </section>

    <section>
        <div class="section-head">
            <div>
                <h1 style="font-size:22px;">下單紀錄</h1>
                <div id="recordCount" class="record-count">0 筆</div>
            </div>
            <button id="clearBtn" type="button">清空紀錄</button>
        </div>

        <div id="recordList" class="record-list"></div>
    </section>
</main>

<script>
"use strict";

/*
  精簡版：
  - 舊 bryce-trading-dashboard-v2 紀錄會在首次載入本版本時清除。
  - 槓桿固定 50X。
  - 單筆帳戶風險固定 1%。
  - 幣種手動輸入。
  - 無 OKX 行情、無 TP、無交易所、無浮盈、無部分平倉、
    無費用/資金費、無匯入匯出、無搜尋篩選。
*/

const OLD_STORAGE_KEY = "bryce-trading-dashboard-v2";
const STORAGE_KEY = "bryce-trading-1pct-v1";
const RESET_FLAG = "bryce-trading-1pct-reset-done";
const LEVERAGE = 50;
const RISK_PCT = 1;

const $ = id => document.getElementById(id);
const form = $("tradeForm");

let lastCalculation = null;

/* 一次性清除舊版交易紀錄 */
if (localStorage.getItem(RESET_FLAG) !== "1") {
    localStorage.removeItem(OLD_STORAGE_KEY);
    localStorage.removeItem(STORAGE_KEY);
    localStorage.setItem(RESET_FLAG, "1");
}

function readRecords() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
    } catch {
        return [];
    }
}

let records = readRecords();

function saveRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function num(value, digits = 4) {
    if (!Number.isFinite(value)) return "—";
    return value.toLocaleString("en-US", {
        maximumFractionDigits: digits
    });
}

function uid() {
    return globalThis.crypto?.randomUUID?.() ||
        Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function positive(value) {
    const n = Number(value);
    return Number.isFinite(n) && n > 0 ? n : null;
}

function setText(id, text) {
    $(id).textContent = text;
}

function clearResults() {
    lastCalculation = null;
    setText("marginResult", "—");
    setText("marginPctResult", "—");
    setText("riskResult", "—");
    setText("notionalResult", "—");
    setText("quantityResult", "—");
    setText("stopPctResult", "—");
    $("saveBtn").disabled = true;
}

function calculate() {
    $("error").textContent = "";
    clearResults();

    const balance = positive(form.elements.balance.value);
    const symbol = form.elements.symbol.value.trim().toUpperCase();
    const side = form.elements.side.value;
    const entry = positive(form.elements.entry.value);
    const sl = positive(form.elements.sl.value);

    if (!balance || !symbol || !entry || !sl) return;

    if (side === "long" && sl >= entry) {
        $("error").textContent = "做多時，止損價必須低於進場價。";
        return;
    }

    if (side === "short" && sl <= entry) {
        $("error").textContent = "做空時，止損價必須高於進場價。";
        return;
    }

    const maxLoss = balance * RISK_PCT / 100;
    const stopDistance = Math.abs(entry - sl);
    const stopPct = stopDistance / entry * 100;
    const quantity = maxLoss / stopDistance;
    const notional = quantity * entry;
    const margin = notional / LEVERAGE;
    const marginPct = margin / balance * 100;

    if (![maxLoss, stopDistance, stopPct, quantity, notional, margin, marginPct].every(Number.isFinite)) {
        $("error").textContent = "計算超出數值範圍。";
        return;
    }

    setText("marginResult", `${num(margin, 4)} U`);
    setText("marginPctResult", `${num(marginPct, 2)}%`);
    setText("riskResult", `${num(maxLoss, 4)} U`);
    setText("notionalResult", `${num(notional, 2)} U`);
    setText("quantityResult", num(quantity, 8));
    setText("stopPctResult", `${num(stopPct, 3)}%`);

    if (marginPct > 100) {
        $("error").textContent =
            `此 Entry / SL 距離在 50X 下需要約 ${num(marginPct, 2)}% 總資金作為保證金，超過可用資金。`;
        $("saveBtn").disabled = true;
    } else {
        $("saveBtn").disabled = false;
    }

    lastCalculation = {
        id: uid(),
        createdAt: new Date().toISOString(),
        balance,
        symbol,
        side,
        leverage: LEVERAGE,
        riskPct: RISK_PCT,
        entry,
        sl,
        maxLoss,
        stopPct,
        quantity,
        notional,
        margin,
        marginPct
    };
}

function renderRecords() {
    $("recordCount").textContent = `${records.length} 筆`;

    if (!records.length) {
        $("recordList").innerHTML =
            '<div class="empty">目前沒有下單紀錄。</div>';
        return;
    }

    $("recordList").innerHTML = records
        .slice()
        .reverse()
        .map(record => `
            <article class="record-card">
                <div class="record-top">
                    <div>
                        <div class="symbol">${escapeHtml(record.symbol)}</div>
                        <div class="meta">
                            <span class="${record.side === "long" ? "positive" : "negative"}">
                                ${record.side.toUpperCase()}
                            </span>
                            · 50X · 風險 1%
                        </div>
                    </div>
                    <button class="delete-btn" type="button"
                            data-delete="${escapeHtml(record.id)}">刪除</button>
                </div>

                <div class="record-grid">
                    <div class="mini"><span>進場價</span><strong>${num(record.entry, 8)}</strong></div>
                    <div class="mini"><span>止損價</span><strong>${num(record.sl, 8)}</strong></div>
                    <div class="mini"><span>保證金</span><strong>${num(record.margin, 4)} U</strong></div>
                    <div class="mini"><span>最大虧損</span><strong>${num(record.maxLoss, 4)} U</strong></div>
                    <div class="mini"><span>名義倉位</span><strong>${num(record.notional, 2)} U</strong></div>
                    <div class="mini"><span>持倉數量</span><strong>${num(record.quantity, 8)}</strong></div>
                    <div class="mini"><span>SL 距離</span><strong>${num(record.stopPct, 3)}%</strong></div>
                    <div class="mini"><span>使用總資金</span><strong>${num(record.marginPct, 2)}%</strong></div>
                </div>
            </article>
        `).join("");
}

form.addEventListener("input", calculate);
form.addEventListener("change", calculate);

$("saveBtn").addEventListener("click", () => {
    calculate();
    if (!lastCalculation || $("saveBtn").disabled) return;

    records.push(lastCalculation);
    saveRecords();
    renderRecords();

    form.elements.symbol.value = "";
    form.elements.entry.value = "";
    form.elements.sl.value = "";
    clearResults();
    form.elements.symbol.focus();
});

$("recordList").addEventListener("click", event => {
    const button = event.target.closest("[data-delete]");
    if (!button) return;

    records = records.filter(record => record.id !== button.dataset.delete);
    saveRecords();
    renderRecords();
});

$("clearBtn").addEventListener("click", () => {
    if (!records.length) return;
    if (!confirm("確定清空全部下單紀錄？")) return;

    records = [];
    saveRecords();
    renderRecords();
});

renderRecords();
calculate();
</script>
</body>
</html>
