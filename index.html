<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bryce Strategy</title>

<style>
:root {
    color-scheme: dark;
    --panel: #101824;
    --panel-2: #0b121d;
    --border: #29394f;
    --text: #eef4fc;
    --muted: #9aaac0;
    --green: #21d6a2;
    --red: #ff708c;
    --yellow: #f0c65d;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0b111b, #05080d);
    color: var(--text);
    font-family: Arial, "Noto Sans TC", sans-serif;
}

button, input, select { font: inherit; }

button, input, select {
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    background: var(--panel-2);
}

button {
    min-height: 36px;
    padding: 7px 11px;
    font-weight: 700;
    cursor: pointer;
}

button:hover { border-color: #6b87ad; }
button:disabled { opacity: .45; cursor: not-allowed; }

input, select {
    width: 100%;
    min-width: 0;
    height: 38px;
    padding: 8px 10px;
}

label {
    display: grid;
    gap: 5px;
    color: var(--muted);
    font-size: 11px;
}

h1, h2, p { margin: 0; }
[hidden] { display: none !important; }

.app {
    width: min(100% - 24px, 720px);
    margin: auto;
    padding: 18px 0 56px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
}

.brand-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: #223b5b;
    font-weight: 900;
    font-size: 14px;
}

.brand strong { font-size: 18px; }

#calcToggle {
    width: 40px;
    height: 40px;
    min-height: 40px;
    flex: 0 0 40px;
    padding: 0;
    border-radius: 10px;
    font-size: 19px;
}

#calcToggle[aria-expanded="true"] {
    color: var(--yellow);
    border-color: var(--yellow);
}

.panel {
    width: min(100%, 620px);
    margin: 14px 0 0 auto;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
}

.panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
}

.panel-head h2 {
    font-size: 19px;
}

.close-btn {
    width: 34px;
    height: 34px;
    min-height: 34px;
    padding: 0;
    font-size: 17px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 12px;
    row-gap: 10px;
    margin-top: 12px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-top: 12px;
}

.result-grid.single-result {
    grid-template-columns: minmax(0, 180px);
}

.cell {
    min-width: 0;
    padding: 10px 12px;
    border-radius: 9px;
    background: #080f1980;
}

.cell.focus {
    border: 1px solid #6c6234;
    background: #211e12;
}

.cell-label {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.35;
}

.cell-value {
    margin-top: 5px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 16px;
    font-weight: 900;
}

.cell.focus .cell-value {
    color: var(--yellow);
    font-size: 18px;
}

.positive { color: var(--green); }
.negative { color: var(--red); }

.error {
    margin-top: 14px;
    color: #ff9caf;
    font-size: 13px;
    line-height: 1.6;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
}

.primary {
    background: #20486c;
    border-color: #37678d;
}

.compact-save {
    min-width: 96px;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
}

.record-count {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
}

.record-list {
    display: grid;
    gap: 10px;
    margin-top: 14px;
}

.record-card {
    padding: 15px;
    border: 1px solid #30445e;
    border-radius: 12px;
    background: #0d1723;
}

.record-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.symbol {
    font-size: 19px;
    font-weight: 900;
    overflow-wrap: anywhere;
}

.meta {
    margin-top: 5px;
    color: var(--muted);
    font-size: 11px;
}

.record-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 13px;
}

.mini {
    min-width: 0;
    padding: 10px;
    border-radius: 8px;
    background: #080f1980;
}

.mini span {
    display: block;
    color: var(--muted);
    font-size: 10px;
}

.mini strong {
    display: block;
    margin-top: 5px;
    overflow-wrap: anywhere;
    font-family: Consolas, monospace;
    font-size: 13px;
}

.delete-btn {
    min-height: 34px;
    padding: 5px 9px;
    color: #ff9caf;
    font-size: 11px;
}

.empty {
    margin-top: 14px;
    padding: 34px 14px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 620px) {
    .app { width: calc(100% - 16px); padding-top: 12px; }
    .panel {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
    }
    .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 8px;
        row-gap: 9px;
    }
    .result-grid.single-result { grid-template-columns: minmax(0, 170px); }
    .record-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 460px) {
    .form-grid { grid-template-columns: 1fr; }
    .result-grid.single-result { grid-template-columns: 1fr; }
}

@media (max-width: 380px) {
    .result-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<main class="app">
    <header class="header">
        <div class="brand-wrap">
            <div class="logo">BS</div>
            <div class="brand">
                <strong>Bryce Strategy</strong>
            </div>
        </div>

        <button id="calcToggle"
                type="button"
                aria-expanded="false"
                aria-controls="calculator"
                aria-label="倉位計算器"
                title="倉位計算器">%</button>
    </header>

    <section id="calculator" class="panel" hidden>
        <div class="panel-head">
            <h2>倉位計算</h2>
            <button id="calcClose" class="close-btn" type="button" aria-label="關閉">×</button>
        </div>

        <form id="tradeForm" class="form-grid" novalidate>
            <label>幣種
                <input name="symbol" type="text" maxlength="30"
                       placeholder="例如 UNI" autocomplete="off" required>
            </label>

            <label>方向
                <select name="side">
                    <option value="long">LONG · 做多</option>
                    <option value="short">SHORT · 做空</option>
                </select>
            </label>

            <label>進場價
                <input name="entry" type="number" step="any"
                       min="0.00000001" placeholder="例如 7.004" required>
            </label>

            <label>止損價
                <input name="sl" type="number" step="any"
                       min="0.00000001" placeholder="手動輸入" required>
            </label>
        </form>

        <div id="error" class="error" role="status"></div>

        <div id="results" class="result-grid single-result">
            <div class="cell focus">
                <div class="cell-label">建議使用保證金</div>
                <div id="marginPctResult" class="cell-value">—</div>
            </div>
        </div>

        <div class="actions">
            <button id="createOrderBtn" type="button" class="compact-save" disabled>建立下單紀錄</button>
            <button id="saveBtn" type="button" class="primary compact-save" disabled>儲存紀錄</button>
        </div>
    </section>

    <section>
        <div class="section-head">
            <div>
                <h1 style="font-size:22px;">下單紀錄</h1>
                <div id="recordCount" class="record-count">0 筆</div>
            </div>
            <button id="clearBtn" type="button">清空紀錄</button>
        </div>

        <div id="recordList" class="record-list"></div>
    </section>
</main>

<script>
"use strict";

const STORAGE_KEY = "bryce-trading-1pct-v4";

const BALANCE = 50;
const LEVERAGE = 50;
const RISK_PCT = 1;

const $ = id => document.getElementById(id);
const form = $("tradeForm");

let lastCalculation = null;

function readRecords() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
    } catch {
        return [];
    }
}

let records = readRecords();

function saveRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function num(value, digits = 4) {
    if (!Number.isFinite(value)) return "—";
    return value.toLocaleString("en-US", {
        maximumFractionDigits: digits
    });
}

function decimalPlaces(rawValue) {
    const raw = String(rawValue ?? "").trim();
    if (!raw) return 0;

    if (/e/i.test(raw)) {
        const value = Number(raw);
        if (!Number.isFinite(value)) return 0;
        const normalized = value.toFixed(12).replace(/0+$/, "").replace(/\.$/, "");
        const dot = normalized.indexOf(".");
        return dot === -1 ? 0 : normalized.length - dot - 1;
    }

    const dot = raw.indexOf(".");
    return dot === -1 ? 0 : raw.length - dot - 1;
}

function priceByEntry(value, digits) {
    if (!Number.isFinite(value)) return "—";
    return value.toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
    });
}

function uid() {
    return globalThis.crypto?.randomUUID?.() ||
        Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function positive(value) {
    const n = Number(value);
    return Number.isFinite(n) && n > 0 ? n : null;
}

function setText(id, text) {
    $(id).textContent = text;
}

function clearResults() {
    lastCalculation = null;
    setText("marginPctResult", "—");
    $("saveBtn").disabled = true;
    $("createOrderBtn").disabled = true;
}

function calculate() {
    $("error").textContent = "";
    clearResults();

    const symbol = form.elements.symbol.value.trim().toUpperCase();
    const side = form.elements.side.value;

    const entryRaw = form.elements.entry.value.trim();
    const slRaw = form.elements.sl.value.trim();

    const entry = positive(entryRaw);
    const sl = positive(slRaw);
    const entryDecimals = decimalPlaces(entryRaw);

    if (!symbol || !entry || !sl) return;

    if (side === "long" && sl >= entry) {
        $("error").textContent = "LONG 的止損價必須低於進場價。";
        return;
    }

    if (side === "short" && sl <= entry) {
        $("error").textContent = "SHORT 的止損價必須高於進場價。";
        return;
    }

    const maxLoss = BALANCE * RISK_PCT / 100;
    const stopDistance = Math.abs(entry - sl);
    const stopPct = stopDistance / entry * 100;

    const quantity = maxLoss / stopDistance;
    const notional = quantity * entry;
    const margin = notional / LEVERAGE;
    const marginPct = margin / BALANCE * 100;

    if (![maxLoss, stopDistance, stopPct, quantity, notional, margin, marginPct].every(Number.isFinite)) {
        $("error").textContent = "計算超出數值範圍。";
        return;
    }


    setText("marginPctResult", `${num(marginPct, 2)}%`);

    if (marginPct > 100) {
        $("error").textContent =
            `此止損距離在 50X 下需要約 ${num(marginPct, 2)}% 總資金作為保證金，超過可用資金。`;
        $("saveBtn").disabled = true;
        $("createOrderBtn").disabled = true;
    } else {
        $("saveBtn").disabled = false;
        $("createOrderBtn").disabled = false;
    }

    lastCalculation = {
        id: uid(),
        createdAt: new Date().toISOString(),
        symbol,
        side,
        balance: BALANCE,
        leverage: LEVERAGE,
        riskPct: RISK_PCT,
        entry,
        entryDecimals,
        sl,
        stopPct,
        maxLoss,
        quantity,
        notional,
        margin,
        marginPct
    };
}

function renderRecords() {
    $("recordCount").textContent = `${records.length} 筆`;

    if (!records.length) {
        $("recordList").innerHTML =
            '<div class="empty">目前沒有下單紀錄。</div>';
        return;
    }

    $("recordList").innerHTML = records
        .slice()
        .reverse()
        .map(record => `
            <article class="record-card">
                <div class="record-top">
                    <div>
                        <div class="symbol">${escapeHtml(record.symbol)}</div>
                        <div class="meta">
                            <span class="${record.side === "long" ? "positive" : "negative"}">
                                ${record.side.toUpperCase()}
                            </span>
                        </div>
                    </div>
                    <button class="delete-btn" type="button"
                            data-delete="${escapeHtml(record.id)}">刪除</button>
                </div>

                <div class="record-grid">
                    <div class="mini"><span>進場價</span><strong>${priceByEntry(record.entry, record.entryDecimals ?? 8)}</strong></div>
                    <div class="mini"><span>止損價</span><strong>${priceByEntry(record.sl, record.entryDecimals ?? 8)}</strong></div>
                    <div class="mini"><span>保證金</span><strong>${num(record.margin, 4)} U</strong></div>
                    <div class="mini"><span>最大虧損</span><strong>${num(record.maxLoss, 4)} U</strong></div>
                </div>
            </article>
        `).join("");
}

function toggleCalculator(force) {
    const panel = $("calculator");
    const shouldOpen = force === undefined ? panel.hidden : Boolean(force);

    panel.hidden = !shouldOpen;
    $("calcToggle").setAttribute("aria-expanded", String(shouldOpen));

    if (shouldOpen) {
        calculate();
        panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

form.addEventListener("input", calculate);
form.addEventListener("change", calculate);

$("calcToggle").addEventListener("click", () => toggleCalculator());
$("calcClose").addEventListener("click", () => toggleCalculator(false));

function saveCurrentRecord() {
    calculate();
    if (!lastCalculation) return;

    records.push(lastCalculation);
    saveRecords();
    renderRecords();

    form.elements.symbol.value = "";
    form.elements.entry.value = "";
    form.elements.sl.value = "";
    clearResults();
}

$("createOrderBtn").addEventListener("click", saveCurrentRecord);
$("saveBtn").addEventListener("click", saveCurrentRecord);

$("recordList").addEventListener("click", event => {
    const button = event.target.closest("[data-delete]");
    if (!button) return;

    records = records.filter(record => record.id !== button.dataset.delete);
    saveRecords();
    renderRecords();
});

$("clearBtn").addEventListener("click", () => {
    if (!records.length) return;
    if (!confirm("確定清空全部下單紀錄？")) return;

    records = [];
    saveRecords();
    renderRecords();
});

renderRecords();
calculate();
</script>
</body>
</html>
