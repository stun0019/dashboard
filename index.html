<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OKX Trading Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background: #0d0f12;
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .header-left h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header-left p {
      font-size: 14px;
      color: #888;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #999;
      font-size: 13px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.online {
      background: #22c55e;
    }

    .status-dot.error {
      background: #ef4444;
    }

    button {
      border: 1px solid #2b2f35;
      background: #171a1f;
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #22262d;
    }

    /* =========================
       ACCOUNT
    ========================= */

    .account-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #15181d;
      border: 1px solid #252930;
      border-radius: 12px;
      padding: 20px;
    }

    .card-label {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .card-unit {
      font-size: 13px;
      color: #777;
      margin-left: 5px;
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      margin-top: 22px;
      background: #15181d;
      border: 1px solid #252930;
      border-radius: 12px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #252930;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    .section-count {
      font-size: 12px;
      color: #888;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    thead {
      background: #101216;
    }

    th {
      padding: 13px 16px;
      font-size: 12px;
      font-weight: 500;
      color: #777;
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 15px 16px;
      font-size: 14px;
      border-top: 1px solid #20242a;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: #191d22;
    }

    .symbol {
      font-weight: 700;
    }

    .long {
      color: #22c55e;
      font-weight: 700;
    }

    .short {
      color: #ef4444;
      font-weight: 700;
    }

    .profit {
      color: #22c55e;
      font-weight: 600;
    }

    .loss {
      color: #ef4444;
      font-weight: 600;
    }

    .buy {
      color: #22c55e;
    }

    .sell {
      color: #ef4444;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #666;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      opacity: 0.55;
      pointer-events: none;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 850px) {
      .container {
        width: min(100% - 20px, 1400px);
        padding-top: 18px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .account-grid {
        grid-template-columns: 1fr;
      }

      .card-value {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container" id="dashboard">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div class="header-left">
        <h1>OKX Trading Dashboard</h1>
        <p id="lastUpdated">尚未更新</p>
      </div>

      <div class="header-right">

        <div class="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting</span>
        </div>

        <button id="refreshBtn">
          更新
        </button>

      </div>

    </header>


    <!-- =========================
         ACCOUNT
    ========================== -->

    <section class="account-grid">

      <div class="card">
        <div class="card-label">
          總資產
        </div>

        <div class="card-value">
          <span id="totalEquity">--</span>
          <span class="card-unit">USDT</span>
        </div>
      </div>


      <div class="card">
        <div class="card-label">
          可用餘額
        </div>

        <div class="card-value">
          <span id="availableBalance">--</span>
          <span class="card-unit">USDT</span>
        </div>
      </div>


      <div class="card">
        <div class="card-label">
          已使用保證金
        </div>

        <div class="card-value">
          <span id="usedMargin">--</span>
          <span class="card-unit">USDT</span>
        </div>
      </div>

    </section>


    <!-- =========================
         POSITIONS
    ========================== -->

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          持倉
        </div>

        <div class="section-count" id="positionCount">
          0 筆
        </div>

      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>幣種</th>
              <th>方向</th>
              <th>數量</th>
              <th>均價</th>
              <th>Mark Price</th>
              <th>槓桿</th>
              <th>浮動盈虧</th>
            </tr>
          </thead>

          <tbody id="positionTable">
            <tr>
              <td colspan="7" class="empty">
                尚無持倉資料
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>


    <!-- =========================
         ORDERS
    ========================== -->

    <section class="section">

      <div class="section-header">

        <div class="section-title">
          訂單紀錄
        </div>

        <div class="section-count" id="orderCount">
          0 筆
        </div>

      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>時間</th>
              <th>幣種</th>
              <th>方向</th>
              <th>類型</th>
              <th>價格</th>
              <th>數量</th>
              <th>狀態</th>
            </tr>
          </thead>

          <tbody id="orderTable">
            <tr>
              <td colspan="7" class="empty">
                尚無訂單資料
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <script>

    /* ==========================================
       CONFIG
    ========================================== */

    const API = {
      account: "/api/account",
      positions: "/api/positions",
      orders: "/api/orders"
    };

    const REFRESH_INTERVAL = 10000;


    /* ==========================================
       DOM
    ========================================== */

    const dashboard = document.getElementById("dashboard");

    const totalEquity = document.getElementById("totalEquity");
    const availableBalance = document.getElementById("availableBalance");
    const usedMargin = document.getElementById("usedMargin");

    const positionTable = document.getElementById("positionTable");
    const orderTable = document.getElementById("orderTable");

    const positionCount = document.getElementById("positionCount");
    const orderCount = document.getElementById("orderCount");

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    const lastUpdated = document.getElementById("lastUpdated");

    const refreshBtn = document.getElementById("refreshBtn");


    /* ==========================================
       UTILS
    ========================================== */

    function formatNumber(value, digits = 2) {

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return number.toLocaleString("en-US", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });

    }


    function formatPrice(value) {

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      if (number >= 1000) {
        return formatNumber(number, 2);
      }

      if (number >= 1) {
        return formatNumber(number, 4);
      }

      return formatNumber(number, 6);

    }


    function formatDate(timestamp) {

      if (!timestamp) {
        return "--";
      }

      const date = new Date(Number(timestamp));

      if (Number.isNaN(date.getTime())) {
        return timestamp;
      }

      return date.toLocaleString("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

    }


    function pnlClass(value) {

      const number = Number(value);

      if (number > 0) {
        return "profit";
      }

      if (number < 0) {
        return "loss";
      }

      return "";

    }


    /* ==========================================
       ACCOUNT
    ========================================== */

    async function loadAccount() {

      const response = await fetch(API.account);

      if (!response.ok) {
        throw new Error("Account API Error");
      }

      const data = await response.json();

      /*
        Backend 建議回傳：

        {
          "totalEquity": 91.23,
          "availableBalance": 75.50,
          "usedMargin": 15.73
        }
      */

      totalEquity.textContent =
        formatNumber(data.totalEquity);

      availableBalance.textContent =
        formatNumber(data.availableBalance);

      usedMargin.textContent =
        formatNumber(data.usedMargin);

    }


    /* ==========================================
       POSITIONS
    ========================================== */

    async function loadPositions() {

      const response = await fetch(API.positions);

      if (!response.ok) {
        throw new Error("Positions API Error");
      }

      const data = await response.json();

      /*
        Backend 建議回傳：

        [
          {
            "symbol": "BTC-USDT-SWAP",
            "side": "long",
            "size": 0.01,
            "avgPrice": 112000,
            "markPrice": 113200,
            "leverage": 20,
            "unrealizedPnl": 12.4
          }
        ]
      */

      positionCount.textContent =
        `${data.length} 筆`;

      if (!data.length) {

        positionTable.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              目前沒有持倉
            </td>
          </tr>
        `;

        return;
      }

      positionTable.innerHTML =
        data.map(position => {

          const side =
            String(position.side).toLowerCase();

          const sideText =
            side === "long"
              ? "LONG"
              : "SHORT";

          const sideClass =
            side === "long"
              ? "long"
              : "short";

          return `
            <tr>

              <td class="symbol">
                ${position.symbol || "--"}
              </td>

              <td class="${sideClass}">
                ${sideText}
              </td>

              <td>
                ${formatNumber(position.size, 4)}
              </td>

              <td>
                ${formatPrice(position.avgPrice)}
              </td>

              <td>
                ${formatPrice(position.markPrice)}
              </td>

              <td>
                ${position.leverage || "--"}x
              </td>

              <td class="${pnlClass(position.unrealizedPnl)}">
                ${formatNumber(position.unrealizedPnl)}
                USDT
              </td>

            </tr>
          `;

        }).join("");

    }


    /* ==========================================
       ORDERS
    ========================================== */

    async function loadOrders() {

      const response = await fetch(API.orders);

      if (!response.ok) {
        throw new Error("Orders API Error");
      }

      const data = await response.json();

      /*
        Backend 建議回傳：

        [
          {
            "time": 1788471000000,
            "symbol": "BTC-USDT-SWAP",
            "side": "buy",
            "type": "market",
            "price": 112000,
            "size": 0.01,
            "status": "filled"
          }
        ]
      */

      orderCount.textContent =
        `${data.length} 筆`;

      if (!data.length) {

        orderTable.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              尚無訂單紀錄
            </td>
          </tr>
        `;

        return;
      }

      orderTable.innerHTML =
        data.map(order => {

          const side =
            String(order.side).toLowerCase();

          const sideText =
            side === "buy"
              ? "BUY"
              : "SELL";

          const sideClass =
            side === "buy"
              ? "buy"
              : "sell";

          return `
            <tr>

              <td>
                ${formatDate(order.time)}
              </td>

              <td class="symbol">
                ${order.symbol || "--"}
              </td>

              <td class="${sideClass}">
                ${sideText}
              </td>

              <td>
                ${String(order.type || "--").toUpperCase()}
              </td>

              <td>
                ${formatPrice(order.price)}
              </td>

              <td>
                ${formatNumber(order.size, 4)}
              </td>

              <td>
                ${String(order.status || "--").toUpperCase()}
              </td>

            </tr>
          `;

        }).join("");

    }


    /* ==========================================
       DASHBOARD LOAD
    ========================================== */

    async function loadDashboard() {

      dashboard.classList.add("loading");

      statusText.textContent =
        "Updating";

      statusDot.className =
        "status-dot";

      try {

        await Promise.all([
          loadAccount(),
          loadPositions(),
          loadOrders()
        ]);

        statusDot.className =
          "status-dot online";

        statusText.textContent =
          "Connected";

        lastUpdated.textContent =
          `最後更新：${new Date().toLocaleString("zh-TW")}`;

      }

      catch (error) {

        console.error(error);

        statusDot.className =
          "status-dot error";

        statusText.textContent =
          "Connection Error";

        lastUpdated.textContent =
          "無法取得 OKX 資料";

      }

      finally {

        dashboard.classList.remove("loading");

      }

    }


    /* ==========================================
       EVENTS
    ========================================== */

    refreshBtn.addEventListener(
      "click",
      loadDashboard
    );


    /* ==========================================
       START
    ========================================== */

    loadDashboard();

    setInterval(
      loadDashboard,
      REFRESH_INTERVAL
    );

  </script>

</body>
</html>
