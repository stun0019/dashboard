<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>倉位計算器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #f3f5f7;
      min-height: 100vh;
    }

    .container {
      width: min(100% - 28px, 520px);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #8f9baa;
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      background: #121821;
      border: 1px solid #202936;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: #9aa5b3;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      border: 1px solid #2a3442;
      background: #0d131b;
      color: #ffffff;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #5f7cff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .direction-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .direction-btn {
      border: 1px solid #2a3442;
      background: #0d131b;
      color: #aab4c2;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .direction-btn.long.active {
      background: rgba(30, 210, 140, 0.12);
      border-color: #1ed28c;
      color: #1ed28c;
    }

    .direction-btn.short.active {
      background: rgba(255, 84, 98, 0.12);
      border-color: #ff5462;
      color: #ff5462;
    }

    .result-main {
      text-align: center;
      padding: 8px 0 20px;
    }

    .result-label {
      font-size: 13px;
      color: #8f9baa;
      margin-bottom: 8px;
    }

    .result-value {
      font-size: 38px;
      font-weight: 800;
      font-family: Consolas, monospace;
    }

    .result-unit {
      font-size: 16px;
      color: #8f9baa;
      margin-left: 4px;
    }

    .metrics {
      display: grid;
      gap: 10px;
    }

    .metric {
      background: #0d131b;
      border-radius: 12px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .metric span:first-child {
      color: #8f9baa;
      font-size: 13px;
    }

    .metric span:last-child {
      font-family: Consolas, monospace;
      font-weight: 700;
      text-align: right;
    }

    .risk-bar {
      height: 10px;
      border-radius: 999px;
      background: #232d39;
      overflow: hidden;
      margin-top: 14px;
    }

    .risk-fill {
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
      background: #ffffff;
    }

    .warning {
      margin-top: 12px;
      font-size: 13px;
      color: #9aa5b3;
      line-height: 1.55;
    }

    .formula {
      font-family: Consolas, monospace;
      font-size: 13px;
      color: #aeb8c6;
      background: #0d131b;
      border-radius: 12px;
      padding: 14px;
      line-height: 1.7;
      overflow-x: auto;
    }

    .error {
      color: #ff6b76;
    }

    @media (max-width: 420px) {
      .container {
        width: min(100% - 20px, 520px);
        padding-top: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .result-value {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>倉位計算器</h1>
      <p>
        先設定最大可承受虧損，再依進場價、止損與槓桿，
        自動反推出適合使用多少保證金。
      </p>
    </header>

    <section class="card">
      <div class="card-title">交易設定</div>

      <div class="field">
        <label>交易方向</label>

        <div class="direction-group">
          <button
            class="direction-btn long"
            id="longBtn"
            onclick="setDirection('long')"
          >
            LONG 做多
          </button>

          <button
            class="direction-btn short active"
            id="shortBtn"
            onclick="setDirection('short')"
          >
            SHORT 做空
          </button>
        </div>
      </div>

      <div class="field">
        <label for="balance">總資金 USDT</label>
        <input
          id="balance"
          type="number"
          step="0.01"
          value="60"
          oninput="calculate()"
        />
      </div>

      <div class="row">

        <div class="field">
          <label for="riskPercent">單筆最大風險 %</label>
          <input
            id="riskPercent"
            type="number"
            step="0.1"
            value="10"
            oninput="calculate()"
          />
        </div>

        <div class="field">
          <label for="leverage">槓桿倍數</label>
          <input
            id="leverage"
            type="number"
            step="1"
            value="300"
            oninput="calculate()"
          />
        </div>

      </div>

      <div class="row">

        <div class="field">
          <label for="entry">進場價</label>
          <input
            id="entry"
            type="number"
            step="any"
            value="0.4212"
            oninput="calculate()"
          />
        </div>

        <div class="field">
          <label for="sl">止損價 SL</label>
          <input
            id="sl"
            type="number"
            step="any"
            value="0.4262"
            oninput="calculate()"
          />
        </div>

      </div>
    </section>

    <section class="card">

      <div class="result-main">
        <div class="result-label">
          建議使用保證金
        </div>

        <span class="result-value" id="marginResult">
          --
        </span>

        <span class="result-unit">
          USDT
        </span>
      </div>

      <div class="metrics">

        <div class="metric">
          <span>占總資金</span>
          <span id="marginPercentResult">--</span>
        </div>

        <div class="metric">
          <span>最大預計虧損</span>
          <span id="riskAmountResult">--</span>
        </div>

        <div class="metric">
          <span>SL 距離</span>
          <span id="slDistanceResult">--</span>
        </div>

        <div class="metric">
          <span>建議名義倉位</span>
          <span id="notionalResult">--</span>
        </div>

        <div class="metric">
          <span>倉位 / 本金</span>
          <span id="exposureResult">--</span>
        </div>

      </div>

      <div class="risk-bar">
        <div
          class="risk-fill"
          id="riskFill"
        ></div>
      </div>

      <div
        class="warning"
        id="warning"
      ></div>

    </section>

    <section class="card">

      <div class="card-title">
        計算方式
      </div>

      <div class="formula">
SL距離% = |Entry - SL| ÷ Entry × 100

最大虧損 = 總資金 × 風險%

名義倉位 = 最大虧損 ÷ SL距離%

保證金 = 名義倉位 ÷ 槓桿

保證金占本金% = 保證金 ÷ 總資金 × 100
      </div>

    </section>

  </main>


  <script>

    let direction = "short";


    function setDirection(type) {

      direction = type;

      const longBtn =
        document.getElementById("longBtn");

      const shortBtn =
        document.getElementById("shortBtn");


      longBtn.classList.remove("active");
      shortBtn.classList.remove("active");


      if (type === "long") {

        longBtn.classList.add("active");

      } else {

        shortBtn.classList.add("active");

      }


      calculate();
    }


    function calculate() {

      const balance =
        parseFloat(
          document.getElementById("balance").value
        );

      const riskPercent =
        parseFloat(
          document.getElementById("riskPercent").value
        );

      const leverage =
        parseFloat(
          document.getElementById("leverage").value
        );

      const entry =
        parseFloat(
          document.getElementById("entry").value
        );

      const sl =
        parseFloat(
          document.getElementById("sl").value
        );


      const marginResult =
        document.getElementById("marginResult");

      const marginPercentResult =
        document.getElementById(
          "marginPercentResult"
        );

      const riskAmountResult =
        document.getElementById(
          "riskAmountResult"
        );

      const slDistanceResult =
        document.getElementById(
          "slDistanceResult"
        );

      const notionalResult =
        document.getElementById(
          "notionalResult"
        );

      const exposureResult =
        document.getElementById(
          "exposureResult"
        );

      const warning =
        document.getElementById("warning");

      const riskFill =
        document.getElementById("riskFill");


      if (
        !balance ||
        !riskPercent ||
        !leverage ||
        !entry ||
        !sl ||
        balance <= 0 ||
        riskPercent <= 0 ||
        leverage <= 0 ||
        entry <= 0 ||
        sl <= 0
      ) {

        marginResult.textContent = "--";

        marginPercentResult.textContent = "--";
        riskAmountResult.textContent = "--";
        slDistanceResult.textContent = "--";
        notionalResult.textContent = "--";
        exposureResult.textContent = "--";

        warning.textContent =
          "請輸入完整且有效的數值。";

        warning.className =
          "warning error";

        return;
      }


      if (
        direction === "long" &&
        sl >= entry
      ) {

        warning.textContent =
          "做多時，正常止損價格應低於進場價。";

        warning.className =
          "warning error";

        return;
      }


      if (
        direction === "short" &&
        sl <= entry
      ) {

        warning.textContent =
          "做空時，正常止損價格應高於進場價。";

        warning.className =
          "warning error";

        return;
      }


      const slDistanceDecimal =
        Math.abs(entry - sl) / entry;


      const slDistancePercent =
        slDistanceDecimal * 100;


      const riskAmount =
        balance *
        (riskPercent / 100);


      const notional =
        riskAmount /
        slDistanceDecimal;


      const margin =
        notional /
        leverage;


      const marginPercent =
        (margin / balance) * 100;


      const exposureMultiple =
        notional / balance;


      marginResult.textContent =
        formatNumber(margin, 2);


      marginPercentResult.textContent =
        formatNumber(
          marginPercent,
          2
        ) + " %";


      riskAmountResult.textContent =
        formatNumber(
          riskAmount,
          2
        ) + " U";


      slDistanceResult.textContent =
        formatNumber(
          slDistancePercent,
          3
        ) + " %";


      notionalResult.textContent =
        formatNumber(
          notional,
          2
        ) + " U";


      exposureResult.textContent =
        formatNumber(
          exposureMultiple,
          2
        ) + " x";


      warning.className =
        "warning";


      if (riskPercent > 10) {

        warning.textContent =
          "目前單筆風險超過本金 10%，屬於非常激進的設定。";

      } else if (riskPercent >= 5) {

        warning.textContent =
          "目前屬於高風險設定。若連續數筆止損，本金回撤會非常快。";

      } else {

        warning.textContent =
          "目前計算以設定的最大風險為上限。實際成交仍需考慮手續費、滑價與強平風險。";
      }


      const fillWidth =
        Math.min(
          riskPercent * 5,
          100
        );

      riskFill.style.width =
        fillWidth + "%";
    }


    function formatNumber(
      number,
      digits
    ) {

      return Number(number).toLocaleString(
        "en-US",
        {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        }
      );
    }


    calculate();

  </script>

</body>
</html>
