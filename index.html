<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>交易 Dashboard</title>

  <style>
    :root {
      --bg: #090d12;
      --panel: #111821;
      --panel-hover: #151e29;
      --border: #26303d;

      --text: #f1f5f9;
      --muted: #7f8b9d;

      --green: #2fd27c;
      --red: #ff6674;
      --yellow: #e9bd4c;
      --blue: #78aefc;

      --risk-bg: rgba(255, 102, 116, 0.18);
      --risk-border: rgba(255, 102, 116, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1280px, calc(100% - 24px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;
      margin-bottom: 14px;
    }

    .header-title {
      min-width: 0;
    }

    .header h1 {
      margin: 0;

      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 4px 0 0;

      color: var(--muted);
      font-size: 12px;
    }

    .refresh-btn {
      min-height: 38px;
      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: var(--panel);
      color: var(--text);

      cursor: pointer;
    }

    .refresh-btn:hover {
      background: var(--panel-hover);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      display: grid;

      grid-template-columns:
        1.35fr
        repeat(4, minmax(0, 1fr));

      gap: 8px;
      margin-bottom: 10px;
    }

    .card {
      min-width: 0;

      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--panel);
    }

    .card.primary {
      padding: 14px 16px;
    }

    .card-label {
      margin-bottom: 4px;

      color: var(--muted);
      font-size: 11px;
    }

    .card-value {
      font-size: 27px;
      font-weight: 900;

      letter-spacing: -0.04em;

      white-space: nowrap;
    }

    .card.primary .card-value {
      font-size: 31px;
    }

    .card-sub {
      margin-top: 3px;

      color: var(--muted);
      font-size: 10px;
    }

    .positive {
      color: var(--green) !important;
    }

    .negative {
      color: var(--red) !important;
    }

    .neutral {
      color: var(--text) !important;
    }

    .yellow {
      color: var(--yellow) !important;
    }

    .blue {
      color: var(--blue) !important;
    }

    /* =========================
       TRADE PANEL
    ========================= */

    .table-panel {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--panel);
    }

    .table-header {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 38px;
      padding: 8px 10px;

      border-bottom: 1px solid var(--border);
    }

    .table-header h2 {
      width: 100%;
      margin: 0;

      text-align: center;

      font-size: 14px;
      font-weight: 800;
    }

    .trade-count {
      position: absolute;
      right: 10px;

      color: var(--muted);

      font-size: 10px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      width: 100%;
      overflow-x: hidden;
    }

    table {
      width: 100%;

      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 6px 3px;

      border-bottom:
        1px solid rgba(38, 48, 61, 0.72);

      text-align: center;

      font-size: 11px;
      line-height: 1.2;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      background: #0e141c;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.018);
    }

    /* 日期 */

    th:nth-child(1),
    td:nth-child(1) {
      width: 12%;
    }

    /* 標的 */

    th:nth-child(2),
    td:nth-child(2) {
      width: 21%;
    }

    /* 方向 */

    th:nth-child(3),
    td:nth-child(3) {
      width: 9%;
    }

    /* 槓桿 */

    th:nth-child(4),
    td:nth-child(4) {
      width: 11%;
    }

    /* 結果 */

    th:nth-child(5),
    td:nth-child(5) {
      width: 12%;
    }

    /* 淨盈虧 */

    th:nth-child(6),
    td:nth-child(6) {
      width: 19%;
    }

    /* 盈虧% */

    th:nth-child(7),
    td:nth-child(7) {
      width: 16%;
    }

    .symbol {
      color: #fff;

      font-weight: 800;
      text-align: center;
    }

    /* =========================
       SIDE BADGE
    ========================= */

    .side {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 30px;
      min-height: 19px;

      padding: 0 5px;

      border-radius: 999px;

      font-size: 9px;
      font-weight: 800;
    }

    .side.long {
      color: var(--green);
      background: rgba(47, 210, 124, 0.08);
    }

    .side.short {
      color: var(--red);
      background: rgba(255, 102, 116, 0.08);
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      font-weight: 800;
    }

    .result.open {
      color: var(--blue);
    }

    /* =========================
       盈虧 %
    ========================= */

    .percent-value {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 43px;

      padding: 2px 4px;

      border: 1px solid transparent;
      border-radius: 6px;

      font-weight: 800;
    }

    .percent-profit {
      color: var(--green);
    }

    .percent-loss {
      color: var(--red);
    }

    .percent-zero {
      color: var(--yellow);
    }

    /*
      單筆虧損超過總資金 10%
      才視為超出風控。

      -10.0% 仍屬正常範圍。
      -10.1% 開始警示。
    */

    .risk-breach {
      color: #fff;

      background: var(--risk-bg);
      border-color: var(--risk-border);

      font-weight: 900;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      display: none;

      padding: 30px 20px;

      color: var(--muted);

      font-size: 12px;
      text-align: center;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-top: 9px;
      padding: 9px 11px;

      border-radius: 9px;

      font-size: 11px;
      line-height: 1.4;
    }

    .message.error {
      display: block;

      border:
        1px solid rgba(255, 102, 116, 0.28);

      background:
        rgba(255, 102, 116, 0.07);

      color: #ff9da6;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .summary {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .card.primary {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: calc(100% - 14px);
        padding-top: 14px;
      }

      .header {
        gap: 8px;
      }

      .header h1 {
        font-size: 21px;
      }

      .header p {
        font-size: 10px;
      }

      .refresh-btn {
        min-height: 34px;
        padding: 0 11px;

        font-size: 11px;
      }

      .summary {
        gap: 6px;
      }

      .card {
        padding: 11px 12px;
      }

      .card-value {
        font-size: 23px;
      }

      .card.primary .card-value {
        font-size: 28px;
      }

      .table-header {
        min-height: 36px;

        padding: 7px 8px;
      }

      .table-header h2 {
        font-size: 13px;
      }

      .trade-count {
        right: 8px;

        font-size: 9px;
      }

      th,
      td {
        padding: 5px 1px;

        font-size: 9px;
      }

      th {
        font-size: 8px;
      }

      .symbol {
        font-size: 9px;
      }

      .side {
        min-width: 24px;
        min-height: 17px;

        padding: 0 2px;

        font-size: 8px;
      }

      .percent-value {
        min-width: 36px;

        padding: 2px 2px;

        font-size: 8px;
      }
    }
  </style>
</head>

<body>

    <section class="table-panel">

  <script>
    (() => {

      /* ==================================================
         資金基準

         2026/08/31
         起始本金 91.23 U

         當前資金 =
         91.23
         +
         2026/08/31 起所有已平倉交易淨盈虧
      ================================================== */

      const STARTING_BALANCE = 91.23;

      const CAPITAL_START_DATE = "2026-08-31";


      /* ==================================================
         風控

         單筆虧損占總資金：
         0 ~ -10% = 正常
         < -10% = 超出風控
      ================================================== */

      const MAX_NORMAL_LOSS_PERCENT = 10;


      /* ==================================================
         Google Sheet
      ================================================== */

      const SHEET_ID =
        "1tPLSXTk56Z-ylsDjz5VQ4R_30J4OFpGAVUmtxujqupE";

      const GID =
        "0";


      const SHEET_URLS = [

        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`,

        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`

      ];


      let trades = [];


      const $ =
        id =>
          document.getElementById(id);


      /* ==================================================
         Google Sheet 欄位

         A 日期
         B 標的
         C 方向
         D 槓桿
         E 淨盈虧
         F 盈虧%

         E 空白 = OPEN
         E > 0 = WIN
         E < 0 = LOSS
         E = 0 = BE

         F 建議格式：
         +5.2%
         -8.5%
         -40.3%
      ================================================== */

      const COLUMN_ALIASES = {

        date: [
          "日期",
          "日期時間",
          "交易日期",
          "date"
        ],

        symbol: [
          "標的",
          "幣種",
          "交易標的",
          "symbol",
          "pair"
        ],

        side: [
          "方向",
          "多空",
          "side"
        ],

        leverage: [
          "槓桿",
          "槓桿倍數",
          "leverage"
        ],

        netPnl: [
          "淨盈虧",
          "淨損益",
          "淨利",
          "netpnl",
          "net pnl"
        ],

        pnlPercent: [
          "盈虧%",
          "盈虧％",
          "損益%",
          "損益％",
          "止盈/止損%",
          "止盈止損%",
          "pnl%",
          "pnlpercent",
          "pnl percent"
        ]

      };


      /* ==================================================
         Helper
      ================================================== */

      function normalizeKey(value) {

        return String(value ?? "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "")
          .replace(
            /[＿_－\-／/\\:：()（）\[\]]/g,
            ""
          );

      }


      function number(value) {

        const cleaned =
          String(value ?? "")
            .replace(/,/g, "")
            .replace(
              /USDT|USDC|USD|U|\$/gi,
              ""
            )
            .trim();


        const result =
          Number(cleaned);


        return Number.isFinite(result)
          ? result
          : 0;

      }


      function percentNumber(value) {

        const text =
          String(value ?? "")
            .trim();


        if (
          text === ""
        ) {

          return null;

        }


        const cleaned =
          text
            .replace(/,/g, "")
            .replace(/％/g, "%")
            .replace(/%/g, "")
            .trim();


        const result =
          Number(cleaned);


        return Number.isFinite(result)
          ? result
          : null;

      }


      function escapeHtml(value) {

        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      }


      function findColumn(
        headers,
        aliases
      ) {

        const normalizedHeaders =
          headers.map(
            header =>
              normalizeKey(header)
          );


        for (
          const alias
          of aliases
        ) {

          const normalizedAlias =
            normalizeKey(alias);


          const index =
            normalizedHeaders.indexOf(
              normalizedAlias
            );


          if (
            index !== -1
          ) {

            return headers[index];

          }

        }


        return null;

      }


      function formatPnl(value) {

        const n =
          number(value);


        return (
          `${n >= 0 ? "+" : ""}` +
          `${n.toFixed(2)} U`
        );

      }


      function formatPercent(value) {

        if (
          value === null ||
          value === undefined ||
          !Number.isFinite(value)
        ) {

          return "-";

        }


        return (
          `${value > 0 ? "+" : ""}` +
          `${value.toFixed(1)}%`
        );

      }


      /* ==================================================
         日期處理
      ================================================== */

      function normalizeDate(value) {

        const text =
          String(value ?? "")
            .trim();


        if (
          !text
        ) {

          return "";

        }


        /*
          YYYY/MM/DD
          YYYY-MM-DD
        */

        let match =
          text.match(
            /(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
          );


        if (
          match
        ) {

          const year =
            match[1];

          const month =
            String(
              match[2]
            ).padStart(
              2,
              "0"
            );

          const day =
            String(
              match[3]
            ).padStart(
              2,
              "0"
            );


          return (
            `${year}-${month}-${day}`
          );

        }


        /*
          MM/DD/YYYY
          MM-DD-YYYY
        */

        match =
          text.match(
            /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
          );


        if (
          match
        ) {

          const month =
            String(
              match[1]
            ).padStart(
              2,
              "0"
            );

          const day =
            String(
              match[2]
            ).padStart(
              2,
              "0"
            );

          const year =
            match[3];


          return (
            `${year}-${month}-${day}`
          );

        }


        return text;

      }


      function displayDate(value) {

        const normalized =
          normalizeDate(value);


        const match =
          normalized.match(
            /(\d{4})-(\d{2})-(\d{2})/
          );


        if (
          !match
        ) {

          return value || "-";

        }


        return (
          `${match[2]}/${match[3]}`
        );

      }


      function todayString() {

        const now =
          new Date();


        const year =
          now.getFullYear();


        const month =
          String(
            now.getMonth() + 1
          ).padStart(
            2,
            "0"
          );


        const day =
          String(
            now.getDate()
          ).padStart(
            2,
            "0"
          );


        return (
          `${year}-${month}-${day}`
        );

      }


      /* ==================================================
         交易日

         如果今天已有交易：
         → 顯示今天

         如果已過 00:00，
         但今天尚未新增交易：
         → 繼續顯示 Sheet 最新交易日

         這樣跨午夜平倉，
         不會讓上方 Panel 突然歸零。
      ================================================== */

      function getActiveTradeDate() {

        if (
          trades.length === 0
        ) {

          return todayString();

        }


        const today =
          todayString();


        const hasTodayTrade =
          trades.some(

            trade =>
              trade.date === today

          );


        if (
          hasTodayTrade
        ) {

          return today;

        }


        const validDates =
          trades
            .map(
              trade =>
                trade.date
            )
            .filter(
              date =>
                /^\d{4}-\d{2}-\d{2}$/.test(date)
            );


        if (
          validDates.length === 0
        ) {

          return today;

        }


        return validDates.sort().at(-1);

      }


      /* ==================================================
         CSV Parser
      ================================================== */

      function parseCSV(text) {

        const rows = [];

        let row = [];
        let cell = "";

        let inQuotes =
          false;


        for (
          let i = 0;
          i < text.length;
          i++
        ) {

          const char =
            text[i];

          const next =
            text[i + 1];


          if (
            inQuotes
          ) {

            if (
              char === '"' &&
              next === '"'
            ) {

              cell += '"';

              i++;

            }

            else if (
              char === '"'
            ) {

              inQuotes =
                false;

            }

            else {

              cell +=
                char;

            }

          }

          else {

            if (
              char === '"'
            ) {

              inQuotes =
                true;

            }

            else if (
              char === ","
            ) {

              row.push(
                cell
              );

              cell =
                "";

            }

            else if (
              char === "\n"
            ) {

              row.push(
                cell.replace(
                  /\r$/,
                  ""
                )
              );


              rows.push(
                row
              );


              row =
                [];


              cell =
                "";

            }

            else {

              cell +=
                char;

            }

          }

        }


        if (
          cell.length ||
          row.length
        ) {

          row.push(
            cell.replace(
              /\r$/,
              ""
            )
          );


          rows.push(
            row
          );

        }


        return rows.filter(

          row =>

            row.some(

              value =>

                String(value)
                  .trim() !== ""

            )

        );

      }


      /* ==================================================
         Google Sheet 轉換
      ================================================== */

      function mapSheet(
        matrix
      ) {

        if (
          !matrix.length
        ) {

          return [];

        }


        const headers =
          matrix[0].map(

            value =>
              String(value)
                .trim()

          );


        const columns =
          {};


        Object
          .entries(
            COLUMN_ALIASES
          )
          .forEach(

            ([key, aliases]) => {

              columns[key] =
                findColumn(
                  headers,
                  aliases
                );

            }

          );


        if (
          !columns.date
        ) {

          throw new Error(
            "找不到「日期」欄位"
          );

        }


        if (
          !columns.symbol
        ) {

          throw new Error(
            "找不到「標的」欄位"
          );

        }


        if (
          !columns.netPnl
        ) {

          throw new Error(
            "找不到「淨盈虧」欄位"
          );

        }


        return matrix
          .slice(1)

          .map(

            (values, index) => {

              const row =
                {};


              headers.forEach(

                (
                  header,
                  columnIndex
                ) => {

                  row[header] =
                    values[
                      columnIndex
                    ] ?? "";

                }

              );


              /* =========================
                 淨盈虧
              ========================= */

              const rawPnl =
                row[
                  columns.netPnl
                ] ?? "";


              const hasPnl =
                String(
                  rawPnl
                ).trim() !== "";


              const netPnl =
                hasPnl
                  ? number(rawPnl)
                  : 0;


              /* =========================
                 盈虧%
              ========================= */

              const rawPnlPercent =
                columns.pnlPercent
                  ? row[
                      columns.pnlPercent
                    ] ?? ""
                  : "";


              const pnlPercent =
                percentNumber(
                  rawPnlPercent
                );


              /* =========================
                 日期
              ========================= */

              const date =
                normalizeDate(
                  row[
                    columns.date
                  ] ?? ""
                );


              /* =========================
                 方向
              ========================= */

              let side =
                columns.side
                  ? String(
                      row[
                        columns.side
                      ] ?? ""
                    ).trim()
                  : "";


              if (
                /long|buy|多單|做多/i
                  .test(side)
              ) {

                side =
                  "多";

              }


              if (
                /short|sell|空單|做空/i
                  .test(side)
              ) {

                side =
                  "空";

              }


              /* =========================
                 狀態
              ========================= */

              let status =
                "OPEN";


              if (
                hasPnl
              ) {

                if (
                  netPnl > 0
                ) {

                  status =
                    "WIN";

                }

                else if (
                  netPnl < 0
                ) {

                  status =
                    "LOSS";

                }

                else {

                  status =
                    "BE";

                }

              }


              return {

                id:
                  index,

                date,

                symbol:
                  String(
                    row[
                      columns.symbol
                    ] ?? ""
                  ).trim(),

                side,

                leverage:
                  columns.leverage
                    ? String(
                        row[
                          columns.leverage
                        ] ?? ""
                      ).trim()
                    : "",

                status,

                hasPnl,

                netPnl,

                pnlPercent

              };

            }

          )

          .filter(

            trade =>

              trade.symbol !== ""

          );

      }


      /* ==================================================
         Google Sheet Fetch
      ================================================== */

      async function fetchSheet() {

        const button =
          $("refreshBtn");


        const message =
          $("message");


        button.disabled =
          true;


        button.textContent =
          "更新中";


        message.className =
          "message";


        message.style.display =
          "none";


        let lastError =
          null;


        for (
          const baseUrl
          of SHEET_URLS
        ) {

          try {

            const url =
              `${baseUrl}` +
              `${baseUrl.includes("?") ? "&" : "?"}` +
              `_=${Date.now()}`;


            const response =
              await fetch(

                url,

                {
                  cache:
                    "no-store",

                  credentials:
                    "omit"
                }

              );


            if (
              !response.ok
            ) {

              throw new Error(
                `HTTP ${response.status}`
              );

            }


            const text =
              await response.text();


            if (
              /<!doctype html|<html/i
                .test(
                  text.slice(
                    0,
                    500
                  )
                )
            ) {

              throw new Error(
                "Google Sheet 尚未開放讀取"
              );

            }


            const matrix =
              parseCSV(

                text.replace(
                  /^\uFEFF/,
                  ""
                )

              );


            trades =
              mapSheet(
                matrix
              );


            render();


            button.disabled =
              false;


            button.textContent =
              "更新";


            return;

          }

          catch (
            error
          ) {

            lastError =
              error;

          }

        }


        button.disabled =
          false;


        button.textContent =
          "更新";


        message.textContent =
          "讀取失敗：" +
          (
            lastError?.message ||
            "未知錯誤"
          );


        message.className =
          "message error";

      }


      /* ==================================================
         Summary
      ================================================== */

      function renderSummary() {

        const today =
          todayString();


        const activeTradeDate =
          getActiveTradeDate();


        /*
          如果交易日就是今天，
          Panel 顯示「今日」。

          如果是跨午夜且沒有新交易，
          顯示例如「08/31」。
        */

        const dayLabel =
          activeTradeDate === today
            ? "今日"
            : displayDate(
                activeTradeDate
              );


        $("tradeDayLabel")
          .textContent =
            `${dayLabel}交易`;


        $("winLossLabel")
          .textContent =
            `${dayLabel}勝 / 負`;


        $("winRateLabel")
          .textContent =
            `${dayLabel}勝率`;


        $("pnlLabel")
          .textContent =
            `${dayLabel}淨盈虧`;


        /* ==================================================
           當前交易日
        ================================================== */

        const activeTrades =
          trades.filter(

            trade =>

              trade.date ===
              activeTradeDate

          );


        const activeOpenTrades =
          activeTrades.filter(

            trade =>
              trade.status === "OPEN"

          );


        const activeClosedTrades =
          activeTrades.filter(

            trade =>
              trade.status !== "OPEN"

          );


        const activeWins =
          activeClosedTrades.filter(

            trade =>
              trade.netPnl > 0

          ).length;


        const activeLosses =
          activeClosedTrades.filter(

            trade =>
              trade.netPnl < 0

          ).length;


        const closedCount =
          activeWins +
          activeLosses;


        const winRate =
          closedCount > 0

            ? (
                activeWins /
                closedCount
              ) * 100

            : 0;


        const activePnl =
          activeClosedTrades.reduce(

            (
              total,
              trade
            ) =>

              total +
              trade.netPnl,

            0

          );


        /* ==================================================
           累積資金

           只計算：
           1. 2026/08/31 起
           2. 已平倉
        ================================================== */

        const capitalTrades =
          trades.filter(

            trade =>

              trade.date >=
                CAPITAL_START_DATE &&

              trade.status !==
                "OPEN"

          );


        const cumulativePnl =
          capitalTrades.reduce(

            (
              total,
              trade
            ) =>

              total +
              trade.netPnl,

            0

          );


        const currentBalance =
          STARTING_BALANCE +
          cumulativePnl;


        /* =========================
           資金水位
        ========================= */

        const balanceElement =
          $("balance");


        balanceElement.textContent =
          `${currentBalance.toFixed(2)} U`;


        balanceElement.className =
          "card-value";


        if (
          currentBalance >
          STARTING_BALANCE
        ) {

          balanceElement
            .classList
            .add(
              "positive"
            );

        }

        else if (
          currentBalance <
          STARTING_BALANCE
        ) {

          balanceElement
            .classList
            .add(
              "negative"
            );

        }

        else {

          balanceElement
            .classList
            .add(
              "neutral"
            );

        }


        /* =========================
           累積資金變化
        ========================= */

        $("balanceChange")
          .textContent =

            `起始 ${STARTING_BALANCE.toFixed(2)} U ｜ ` +

            `累積 ${cumulativePnl >= 0 ? "+" : ""}` +

            `${cumulativePnl.toFixed(2)} U`;


        /* =========================
           交易數
        ========================= */

        $("todayTrades")
          .textContent =
            activeTrades.length;


        $("openTradeText")
          .textContent =
            `持倉 ${activeOpenTrades.length} 筆`;


        /* =========================
           勝 / 負
        ========================= */

        $("todayWL")
          .innerHTML =

            `<span class="positive">${activeWins}</span>` +

            ` / ` +

            `<span class="negative">${activeLosses}</span>`;


        /* =========================
           勝率
        ========================= */

        const winRateElement =
          $("winRate");


        winRateElement.className =
          "card-value";


        if (
          closedCount === 0
        ) {

          winRateElement.textContent =
            "--";


          winRateElement
            .classList
            .add(
              "neutral"
            );

        }

        else {

          winRateElement.textContent =
            `${winRate.toFixed(1)}%`;


          if (
            winRate < 50
          ) {

            winRateElement
              .classList
              .add(
                "negative"
              );

          }

          else if (
            winRate > 50
          ) {

            winRateElement
              .classList
              .add(
                "positive"
              );

          }

          else {

            winRateElement
              .classList
              .add(
                "yellow"
              );

          }

        }


        /* =========================
           淨盈虧
        ========================= */

        const pnlElement =
          $("todayPnl");


        pnlElement.textContent =
          formatPnl(
            activePnl
          );


        pnlElement.className =
          "card-value";


        if (
          activePnl > 0
        ) {

          pnlElement
            .classList
            .add(
              "positive"
            );

        }

        else if (
          activePnl < 0
        ) {

          pnlElement
            .classList
            .add(
              "negative"
            );

        }

        else {

          pnlElement
            .classList
            .add(
              "neutral"
            );

        }


        $("todayTradesText")
          .textContent =
            `已平倉 ${activeClosedTrades.length} 筆`;

      }


      /* ==================================================
         盈虧 % 樣式
      ================================================== */

      function getPercentClass(
        pnlPercent
      ) {

        if (
          pnlPercent === null ||
          pnlPercent === undefined
        ) {

          return "";

        }


        /*
          虧損超過 -10%
          例如 -10.1%、-20%、-40%
        */

        if (
          pnlPercent <
          -MAX_NORMAL_LOSS_PERCENT
        ) {

          return "risk-breach";

        }


        if (
          pnlPercent < 0
        ) {

          return "percent-loss";

        }


        if (
          pnlPercent > 0
        ) {

          return "percent-profit";

        }


        return "percent-zero";

      }


      function getPercentTitle(
        pnlPercent
      ) {

        if (
          pnlPercent === null ||
          pnlPercent === undefined
        ) {

          return "";

        }


        if (
          pnlPercent <
          -MAX_NORMAL_LOSS_PERCENT
        ) {

          return "超出單筆 10% 風控";

        }


        if (
          pnlPercent < 0
        ) {

          return "正常風控範圍";

        }


        return "";

      }


      /* ==================================================
         Table
      ================================================== */

      function renderTable() {

        const tbody =
          $("tradeRows");


        const empty =
          $("emptyState");


        tbody.innerHTML =
          "";


        const sortedTrades =
          [...trades]
            .reverse();


        $("tradeCount")
          .textContent =
            `${trades.length} 筆`;


        empty.style.display =
          sortedTrades.length
            ? "none"
            : "block";


        for (
          const trade
          of sortedTrades
        ) {

          const row =
            document.createElement(
              "tr"
            );


          /* =========================
             槓桿
          ========================= */

          let leverage =
            trade.leverage ||
            "-";


          if (
            leverage !== "-" &&
            !String(leverage)
              .toLowerCase()
              .includes("x")
          ) {

            leverage +=
              "x";

          }


          /* =========================
             淨盈虧
          ========================= */

          const pnlClass =
            trade.status === "OPEN"

              ? "blue"

              : trade.netPnl > 0

                ? "positive"

                : trade.netPnl < 0

                  ? "negative"

                  : "yellow";


          const pnlText =
            trade.status === "OPEN"

              ? "-"

              : formatPnl(
                  trade.netPnl
                );


          /* =========================
             Result
          ========================= */

          const resultClass =
            trade.status === "WIN"

              ? "positive"

              : trade.status === "LOSS"

                ? "negative"

                : trade.status === "OPEN"

                  ? "open"

                  : "yellow";


          /* =========================
             盈虧 %
          ========================= */

          const percentText =
            trade.status === "OPEN"

              ? "-"

              : formatPercent(
                  trade.pnlPercent
                );


          const percentClass =
            trade.status === "OPEN"

              ? ""

              : getPercentClass(
                  trade.pnlPercent
                );


          const percentTitle =
            trade.status === "OPEN"

              ? ""

              : getPercentTitle(
                  trade.pnlPercent
                );


          row.innerHTML = `

            <td>
              ${escapeHtml(
                displayDate(
                  trade.date
                )
              )}
            </td>

            <td class="symbol">
              ${escapeHtml(
                trade.symbol
              )}
            </td>

            <td>

              ${
                trade.side

                  ? `
                    <span
                      class="side ${
                        trade.side === "多"
                          ? "long"
                          : "short"
                      }"
                    >
                      ${escapeHtml(
                        trade.side
                      )}
                    </span>
                  `

                  : "-"
              }

            </td>

            <td>
              ${escapeHtml(
                leverage
              )}
            </td>

            <td
              class="result ${resultClass}"
            >
              ${escapeHtml(
                trade.status
              )}
            </td>

            <td
              class="${pnlClass}"
            >
              ${escapeHtml(
                pnlText
              )}
            </td>

            <td>

              <span
                class="percent-value ${percentClass}"
                title="${escapeHtml(
                  percentTitle
                )}"
              >
                ${escapeHtml(
                  percentText
                )}
              </span>

            </td>

          `;


          tbody.appendChild(
            row
          );

        }

      }


      /* ==================================================
         Render
      ================================================== */

      function render() {

        renderSummary();

        renderTable();

      }


      /* ==================================================
         Events
      ================================================== */

      $("refreshBtn")
        .addEventListener(
          "click",
          fetchSheet
        );


      /* ==================================================
         Init
      ================================================== */

      render();

      fetchSheet();

    })();
  </script>
